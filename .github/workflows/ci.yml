name: Client checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/website-entry
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: google-chrome --version
      - run: node --check site-entry.mjs
      - run: node --test site-entry.test.mjs
      - run: python3 -m unittest -v patch_shells_test.py

  download-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/download-relay
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.1'
          cache: false
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off go test -race ./...
      - name: Build independent static download relay
        run: GOWORK=off CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/yitoken-download-relay" .

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - name: Install native media build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm yasm gnupg xz-utils
      - run: npm ci
      - name: Build native checksum-locked FFmpeg and x264
        run: npm run build:media
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:app
