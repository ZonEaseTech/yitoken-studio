name: Verified desktop prerelease

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact application version tag (not a branch)
        type: string
        required: true
      mac_signing_mode:
        description: macOS trust profile (ad-hoc publication needs explicit alpha override)
        type: choice
        required: true
        default: adhoc
        options: [adhoc, developer-id]
      allow_adhoc_prerelease:
        description: Explicitly allow an unnotarized ad-hoc alpha prerelease (system protection may block it)
        type: boolean
        required: true
        default: false
      publish:
        description: Publish a new GitHub prerelease only after every build succeeds
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_ref: ${{ steps.identity.outputs.source_ref }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      publish: ${{ steps.identity.outputs.publish }}
      mac_signing_mode: ${{ steps.identity.outputs.mac_signing_mode }}
      allow_adhoc_prerelease: ${{ steps.identity.outputs.allow_adhoc_prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - name: Require exact version tag and freeze commit identity
        id: identity
        env:
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
          REQUEST_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          MAC_SIGNING_MODE: ${{ github.event_name == 'push' && 'adhoc' || inputs.mac_signing_mode }}
          ALLOW_ADHOC_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_adhoc_prerelease }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tag = process.env.SOURCE_REF;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version) || tag !== `v${version}`) {
            throw new Error('source_ref must be the exact vVERSION tag from package.json; branches are not accepted');
          }
          const ref = `refs/tags/${tag}`;
          execFileSync('git', ['show-ref', '--verify', ref]);
          const commit = execFileSync('git', ['rev-parse', `${ref}^{commit}`], {encoding:'utf8'}).trim();
          const head = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          if (commit !== head) throw new Error('Checkout does not match the exact application tag');
          if (tag === 'v0.1.0-alpha.1' && commit !== '8095244a6494575eeb6fb9dca09794341cd4cf0a') {
            throw new Error('Frozen alpha tag changed; never replace this version');
          }
          const publish = process.env.REQUEST_PUBLISH;
          const mode = process.env.MAC_SIGNING_MODE;
          if (!['true', 'false'].includes(publish)) throw new Error('Invalid publish flag');
          if (!['adhoc', 'developer-id'].includes(mode)) throw new Error('Invalid macOS signing mode');
          const allowAdhoc = process.env.ALLOW_ADHOC_PRERELEASE;
          if (!['true', 'false'].includes(allowAdhoc)) throw new Error('Invalid ad-hoc publication override');
          if (publish === 'true') {
            if (process.env.RELEASE_EVENT_NAME !== 'workflow_dispatch' || tag === 'v0.1.0-alpha.1') {
              throw new Error('Publication requires explicit manual dispatch and a new version tag; frozen Alpha1 is immutable');
            }
            if (mode === 'adhoc' && (allowAdhoc !== 'true' || !/^\d+\.\d+\.\d+-alpha\.[1-9]\d*$/.test(version))) {
              throw new Error('Ad-hoc publication requires allow_adhoc_prerelease=true and a new alpha version tag');
            }
          }
          // The exact application tag must contain the repaired build pipeline.
          // Never check out newer scripts over old corresponding source.
          const signing = await import(`${process.cwd()}/scripts/mac-signing.mjs`);
          if (signing.MAC_SIGNING_PIPELINE_VERSION !== 1 || typeof signing.prepareMacSigning !== 'function') {
            throw new Error('Application tag lacks the supported Mac signing pipeline; create a new complete-source version tag');
          }
          const wrapper = readFileSync('scripts/build-desktop.mjs', 'utf8');
          if (!/\bprepareMacSigning\b/.test(wrapper) || !/\bverifyMacSigningOutput\b/.test(wrapper)) {
            throw new Error('Application tag still uses the old unsigned desktop wrapper');
          }
          appendFileSync(process.env.GITHUB_OUTPUT,
            `source_ref=${ref}\nsource_commit=${commit}\nversion=${version}\ntag=${tag}\npublish=${publish}\nmac_signing_mode=${mode}\nallow_adhoc_prerelease=${allowAdhoc}\n`);
          NODE

  source:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false
      - name: Verify frozen source checkout
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - name: Generate complete corresponding source with GNU tar
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tar --version | grep 'GNU tar'
          if [ "$VERSION" = '0.1.0-alpha.1' ]; then
            # This frozen archive used files 0664 and generated directories 0775.
            # Normalize only this tag's tracked regular files, never .git or caches.
            umask 0002
            git ls-files -z > "$RUNNER_TEMP/frozen-source-files"
            while IFS= read -r -d '' file; do
              if [ ! -f "$file" ] || [ -L "$file" ]; then
                echo "Frozen source is not a regular file: $file" >&2
                exit 1
              fi
              chmod 0664 -- "$file"
            done < "$RUNNER_TEMP/frozen-source-files"
          fi
          npm run release:source
          cd release/source
          sha256sum --check "yitoken-studio-${VERSION}-source.tar.gz.sha256"
          if [ "$VERSION" = '0.1.0-alpha.1' ]; then
            printf '%s  %s\n' '78b8a55536ab208c297605083aa8e08219fe7656648c0328f4be387092855e38' "yitoken-studio-${VERSION}-source.tar.gz" | sha256sum --check -
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-source
          path: |
            release/source/*.tar.gz
            release/source/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  desktop:
    needs: validate
    defaults:
      run:
        # GnuPG agent sockets must fit macOS's 104-byte Unix socket path limit.
        working-directory: /tmp/yitoken-desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            media_target: win32-x64
            runner: ubuntu-24.04
          - platform: linux
            arch: x64
            media_target: linux-x64
            runner: ubuntu-24.04
          - platform: mac
            arch: arm64
            media_target: darwin-arm64
            runner: macos-15
          - platform: mac
            arch: x64
            media_target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    # Configure mac-signing with required reviewers and allowed release refs in
    # repository Settings BEFORE use. desktop-build must contain no credentials.
    environment: ${{ matrix.platform == 'mac' && needs.validate.outputs.mac_signing_mode == 'developer-id' && 'mac-signing' || 'desktop-build' }}
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false
      - name: Copy clean frozen checkout to a short private build directory
        working-directory: .
        run: |
          # Fail on an existing path; never reuse or overwrite another checkout.
          mkdir -m 0700 /tmp/yitoken-desktop
          cp -a "$GITHUB_WORKSPACE/." /tmp/yitoken-desktop/
          chmod 0700 /tmp/yitoken-desktop
      - name: Verify application checkout
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - name: Preflight Mac signing credentials before any dependency or application build
        if: matrix.platform == 'mac' && needs.validate.outputs.mac_signing_mode == 'developer-id'
        id: mac_credentials
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_CERTIFICATE_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync, appendFileSync, rmSync } from 'node:fs';
          import { join } from 'node:path';
          import { prepareMacSigning } from './scripts/mac-signing.mjs';
          const required = ['MAC_CERTIFICATE_P12_BASE64','CSC_KEY_PASSWORD','CSC_NAME','APPLE_TEAM_ID','APPLE_API_KEY_P8_BASE64','APPLE_API_KEY_ID','APPLE_API_ISSUER'];
          const missing = required.filter(name => !process.env[name]);
          if (missing.length) throw new Error(`Missing protected mac-signing secrets: ${missing.join(', ')}`);
          const directory = join(process.env.RUNNER_TEMP, 'yitoken-mac-credentials');
          mkdirSync(directory, {mode:0o700});
          try {
            const paths = {};
            for (const [secret, filename, variable] of [
              ['MAC_CERTIFICATE_P12_BASE64','developer-id.p12','CSC_LINK'],
              ['APPLE_API_KEY_P8_BASE64','AuthKey.p8','APPLE_API_KEY']
            ]) {
              const encoded = process.env[secret];
              if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) throw new Error(`Invalid single-line base64 secret: ${secret}`);
              const content = Buffer.from(encoded, 'base64');
              if (!content.length) throw new Error(`Empty decoded secret: ${secret}`);
              const path = join(directory, filename);
              writeFileSync(path, content, {mode:0o600,flag:'wx'});
              paths[variable] = path;
            }
            await prepareMacSigning({environment:{...process.env,...paths,YITOKEN_MAC_SIGNING_MODE:'developer-id'},root:process.cwd()});
            appendFileSync(process.env.GITHUB_OUTPUT, `csc_link=${paths.CSC_LINK}\napple_api_key=${paths.APPLE_API_KEY}\nteam_id=${process.env.APPLE_TEAM_ID}\n`);
          } catch (error) {
            rmSync(directory, {recursive:true,force:true});
            throw error;
          }
          NODE
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm yasm gnupg xz-utils
      - name: Install MinGW and 32/64-bit Wine for Windows packaging
        if: matrix.platform == 'win'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 wine wine64 wine32:i386 xvfb
          echo "WINEPREFIX=${RUNNER_TEMP}/yitoken-wine64" >> "$GITHUB_ENV"
          echo 'WINEARCH=win64' >> "$GITHUB_ENV"
          echo 'USE_SYSTEM_WINE=true' >> "$GITHUB_ENV"
      - name: Prepare matching macOS SDK and canonical temporary directory
        if: runner.os == 'macOS'
        run: |
          for formula in gnupg pkg-config gnu-tar nasm yasm; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then brew install "$formula"; fi
          done
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/yitoken-tmp"
          echo "TMPDIR=$(cd "$RUNNER_TEMP/yitoken-tmp" && pwd -P)/" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "CC=$(xcrun --find clang)" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build native media for real media regression tests
        run: npm run build:media
      - run: npm run typecheck
      - run: npm test
      - name: Cross-build Windows media after native tests pass
        if: matrix.platform == 'win'
        run: npm run build:media:win
      - name: Package Windows with an isolated 64-bit Wine prefix
        if: matrix.platform == 'win'
        run: |
          xvfb-run -a wineboot --init
          wineserver -w
          # The frozen builder infers publication from CI/tag context. Disable
          # inference only in this child; the final publish job owns all uploads.
          env -u GITHUB_REF_TYPE CI=false xvfb-run -a npm run build:win -- --x64
      - name: Package Linux with the verified resource wrapper
        if: matrix.platform == 'linux'
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: env -u GITHUB_REF_TYPE CI=false node scripts/build-desktop.mjs "--$PLATFORM" "--$ARCH"
      - name: Package ad-hoc macOS (not public-trusted)
        if: matrix.platform == 'mac' && needs.validate.outputs.mac_signing_mode == 'adhoc'
        env:
          ARCH: ${{ matrix.arch }}
          YITOKEN_MAC_SIGNING_MODE: adhoc
        run: env -u GITHUB_REF_TYPE CI=false node scripts/build-desktop.mjs --mac "--$ARCH"
      - name: Package Developer ID macOS and require notarization
        if: matrix.platform == 'mac' && needs.validate.outputs.mac_signing_mode == 'developer-id'
        env:
          ARCH: ${{ matrix.arch }}
          YITOKEN_MAC_SIGNING_MODE: developer-id
          CSC_LINK: ${{ steps.mac_credentials.outputs.csc_link }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_CERTIFICATE_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ steps.mac_credentials.outputs.apple_api_key }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: env -u GITHUB_REF_TYPE CI=false node scripts/build-desktop.mjs --mac "--$ARCH"
      - name: Always remove temporary Mac credentials
        if: always() && matrix.platform == 'mac' && needs.validate.outputs.mac_signing_mode == 'developer-id'
        run: |
          node --input-type=module <<'NODE'
          import { rmSync } from 'node:fs';
          import { join } from 'node:path';
          rmSync(join(process.env.RUNNER_TEMP, 'yitoken-mac-credentials'), {recursive:true,force:true});
          NODE
      - name: Collect only verified final installers and source manifest
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          MEDIA_TARGET: ${{ matrix.media_target }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          SOURCE_TAG: ${{ needs.validate.outputs.tag }}
          MAC_SIGNING_MODE: ${{ needs.validate.outputs.mac_signing_mode }}
          EXPECTED_MAC_TEAM_ID: ${{ steps.mac_credentials.outputs.team_id }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, mkdirSync, copyFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          const {PLATFORM: platform, ARCH: arch, VERSION: version, MEDIA_TARGET: target} = process.env;
          const base = join('release', 'build', version);
          const outputs = readdirSync(base, {withFileTypes:true}).filter(e => e.isDirectory() && e.name.startsWith(`${platform}-${arch}-`));
          if (outputs.length !== 1) throw new Error('Expected one finalized verified desktop output; staging is never publishable');
          const directory = join(base, outputs[0].name);
          const expected = {win:['.exe'], linux:['.AppImage'], mac:['.dmg','.zip']}[platform];
          const files = readdirSync(directory, {withFileTypes:true}).filter(e => e.isFile() && expected.some(ext => e.name.endsWith(ext)));
          if (files.length !== expected.length || expected.some(ext => files.filter(f => f.name.endsWith(ext)).length !== 1)) {
            throw new Error('Missing or duplicate platform installer');
          }
          const unpacked = join(directory, platform === 'mac' ? `mac${arch === 'x64' ? '' : `-${arch}`}` : `${platform}-unpacked`);
          let resources = join(unpacked, 'resources');
          if (platform === 'mac') {
            const apps = readdirSync(unpacked, {withFileTypes:true}).filter(e => e.isDirectory() && e.name.endsWith('.app'));
            if (apps.length !== 1) throw new Error('Expected one verified macOS application');
            resources = join(unpacked, apps[0].name, 'Contents', 'Resources');
          }
          const resourceManifest = JSON.parse(readFileSync(join(resources, 'DESKTOP-RESOURCE-PROVENANCE.json'), 'utf8'));
          if (resourceManifest.applicationVersion !== version || resourceManifest.mediaTarget !== target) throw new Error('Packaged resource identity mismatch');
          let macSigning = null;
          if (platform === 'mac') {
            macSigning = JSON.parse(readFileSync(join(directory, 'MAC-SIGNING-PROVENANCE.json'), 'utf8'));
            const developerId = process.env.MAC_SIGNING_MODE === 'developer-id';
            if (macSigning.schemaVersion !== 1 || macSigning.mode !== process.env.MAC_SIGNING_MODE || macSigning.signatureVerified !== true ||
                macSigning.artifactHashScope !== 'after-mac-code-signing' || macSigning.verificationScope !== 'unpacked-app-and-final-dmg-zip' ||
                macSigning.notarized !== developerId || macSigning.gatekeeperAccepted !== developerId ||
                (developerId ? !/^[A-Z0-9]{10}$/.test(macSigning.teamId) || macSigning.teamId !== process.env.EXPECTED_MAC_TEAM_ID : macSigning.teamId !== null)) {
              throw new Error('Missing or invalid native Mac signing/notarization proof');
            }
            if (!Array.isArray(macSigning.mediaArtifacts) || macSigning.mediaArtifacts.length !== 2 ||
                ['ffmpeg','ffprobe'].some(name => macSigning.mediaArtifacts.filter(a => a.filename === name && /^[a-f0-9]{64}$/.test(a.sha256)).length !== 1)) {
              throw new Error('Invalid signed media hashes');
            }
            if (resourceManifest.artifactHashScope !== 'source-build-before-code-signing' || macSigning.mediaArtifacts.some(entry =>
                createHash('sha256').update(readFileSync(join(resources, 'ffmpeg', entry.filename))).digest('hex') !== entry.sha256)) {
              throw new Error('Mac media hash proof does not match final bundled media or pre-sign source scope');
            }
          }
          // GitHub replaces spaces/special characters in uploaded asset names.
          // Freeze public names before checksums/provenance, not after uploading.
          const publicNames = files.map(file => file.name.replace(/[^A-Za-z0-9._-]/g, '.'));
          if (new Set(publicNames).size !== files.length || publicNames.some(name => !/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name))) {
            throw new Error('Unsafe or colliding public installer filename');
          }
          const artifactDir = join(process.env.RUNNER_TEMP, `release-${platform}-${arch}`);
          mkdirSync(artifactDir);
          const assets = files.map((file, index) => {
            const data = readFileSync(join(directory, file.name));
            const filename = publicNames[index];
            copyFileSync(join(directory, file.name), join(artifactDir, filename));
            return {filename, sha256: createHash('sha256').update(data).digest('hex')};
          });
          writeFileSync(join(artifactDir, `BUILD-PROVENANCE-${platform}-${arch}.json`), JSON.stringify({
            product: 'YITOKEN Studio', version, platform, arch, sourceTag: process.env.SOURCE_TAG,
            sourceCommit: process.env.SOURCE_COMMIT, sourceArchive: `yitoken-studio-${version}-source.tar.gz`,
            workflowRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            unsigned: platform !== 'mac' || macSigning.mode !== 'developer-id',
            notarized: platform === 'mac' && macSigning.notarized,
            ...(platform === 'mac' ? {macSigning} : {}), assets, resources: resourceManifest
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-${{ matrix.platform }}-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, source, desktop]
    if: github.event_name == 'workflow_dispatch' && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      MAC_SIGNING_MODE: ${{ needs.validate.outputs.mac_signing_mode }}
      ALLOW_ADHOC_PRERELEASE: ${{ needs.validate.outputs.allow_adhoc_prerelease }}
      RELEASE_EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: false
      - name: Verify every platform manifest and generate aggregate SHA256
        run: |
          python3 <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path('assets')
          version, tag, commit = (os.environ[k] for k in ('VERSION', 'SOURCE_TAG', 'SOURCE_COMMIT'))
          mode = os.environ['MAC_SIGNING_MODE']
          allow_adhoc = os.environ['ALLOW_ADHOC_PRERELEASE']
          if os.environ['RELEASE_EVENT_NAME'] != 'workflow_dispatch' or mode not in ('adhoc', 'developer-id') or allow_adhoc not in ('true', 'false'):
              raise SystemExit('Publication requires explicit manual dispatch and a valid requested signing profile')
          if mode == 'adhoc' and (allow_adhoc != 'true' or not re.fullmatch(r'\d+\.\d+\.\d+-alpha\.[1-9]\d*', version)):
              raise SystemExit('Ad-hoc publication requires explicit approval for a new alpha version')
          expected_dirs = {'release-source', 'release-win-x64', 'release-linux-x64', 'release-mac-arm64', 'release-mac-x64'}
          if {p.name for p in root.iterdir()} != expected_dirs:
              raise SystemExit('Missing or unexpected release artifact group')
          source = root / 'release-source' / f'yitoken-studio-{version}-source.tar.gz'
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          source_hash = digest(source)
          checksum = source.with_name(source.name + '.sha256')
          if checksum.read_text() != f'{source_hash}  {source.name}\n':
              raise SystemExit('Source checksum mismatch')
          if version == '0.1.0-alpha.1':
              raise SystemExit('Frozen Alpha1 must never be republished or repaired in place')
          allowed_files = {source, checksum}
          mac_teams = set()
          for platform, arch, suffixes in [('win','x64',['.exe']), ('linux','x64',['.AppImage']), ('mac','arm64',['.dmg','.zip']), ('mac','x64',['.dmg','.zip'])]:
              directory = root / f'release-{platform}-{arch}'
              manifest = directory / f'BUILD-PROVENANCE-{platform}-{arch}.json'
              data = json.loads(manifest.read_text())
              if (data['version'], data['sourceTag'], data['sourceCommit'], data['platform'], data['arch'], data['sourceArchive']) != (version, tag, commit, platform, arch, source.name):
                  raise SystemExit('Platform provenance identity mismatch')
              if platform == 'mac':
                  proof = data.get('macSigning', {})
                  developer_id = mode == 'developer-id'
                  if data['unsigned'] is not (not developer_id) or data['notarized'] is not developer_id or proof.get('schemaVersion') != 1 or proof.get('mode') != mode or proof.get('signatureVerified') is not True or proof.get('notarized') is not developer_id or proof.get('gatekeeperAccepted') is not developer_id:
                      raise SystemExit('Mac proof does not match the explicitly requested signing profile; no downgrade or false trust claim is allowed')
                  if (developer_id and not re.fullmatch(r'[A-Z0-9]{10}', proof.get('teamId', ''))) or (not developer_id and proof.get('teamId') is not None) or proof.get('artifactHashScope') != 'after-mac-code-signing' or proof.get('verificationScope') != 'unpacked-app-and-final-dmg-zip':
                      raise SystemExit('Mac signing proof identity or verification scope mismatch')
                  mac_teams.add(proof['teamId'])
                  if data['resources'].get('artifactHashScope') != 'source-build-before-code-signing':
                      raise SystemExit('Mac source media hashes must be explicitly pre-sign')
                  media = proof.get('mediaArtifacts', [])
                  if len(media) != 2 or any(sum(a.get('filename') == name and bool(re.fullmatch(r'[a-f0-9]{64}', a.get('sha256', ''))) for a in media) != 1 for name in ['ffmpeg','ffprobe']):
                      raise SystemExit('Mac signed-media hash proof mismatch')
              elif data['unsigned'] is not True or data['notarized'] is not False:
                  raise SystemExit('Incorrect Windows/Linux signing claim')
              entries = data['assets']
              if len(entries) != len(suffixes) or any(sum(a['filename'].endswith(s) for a in entries) != 1 for s in suffixes):
                  raise SystemExit('Incomplete platform installer set')
              allowed_files.add(manifest)
              for entry in entries:
                  if Path(entry['filename']).name != entry['filename']:
                      raise SystemExit('Unsafe asset filename')
                  asset = directory / entry['filename']
                  if digest(asset) != entry['sha256']:
                      raise SystemExit('Installer checksum mismatch')
                  allowed_files.add(asset)
          if len(mac_teams) != 1:
              raise SystemExit('Mac architecture signing teams do not match')
          files = {p for p in root.rglob('*') if p.is_file()}
          if files != allowed_files or any(p.is_symlink() for p in root.rglob('*')):
              raise SystemExit('Unexpected files or symlinks in release artifacts')
          names = [p.name for p in files]
          if len(set(names)) != len(names):
              raise SystemExit('Duplicate public asset filename')
          Path('publish-assets').mkdir()
          import shutil
          for path in sorted(files):
              shutil.copyfile(path, Path('publish-assets') / path.name)
          Path('publish-assets/SHA256SUMS.txt').write_text(''.join(f'{digest(p)}  {p.name}\n' for p in sorted(files, key=lambda p: p.name)))
          PY
      - name: Create draft without replacing an existing release, then publish prerelease
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$SOURCE_TAG" --jq '.sha')" = "$SOURCE_COMMIT"
          # Fail closed on API errors. A pre-existing release (including a draft) is never reused.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > existing-tags.txt
          if grep -Fxq "$SOURCE_TAG" existing-tags.txt; then
            echo 'Release already exists; no release or asset will be overwritten.' >&2
            exit 1
          fi
          if [ "$MAC_SIGNING_MODE" = 'developer-id' ]; then
            cat > release-notes.md <<'NOTES'
          Preview of YITOKEN Studio, based on Moyin Creator by MemeCalculate. macOS installers use verified Developer ID signing and Apple notarization; Windows installers remain unsigned.
          NOTES
            release_label='Developer ID preview'
          else
            cat > release-notes.md <<'NOTES'
          Unnotarized alpha preview of YITOKEN Studio, based on Moyin Creator by MemeCalculate. macOS applications use complete ad-hoc signatures only: they have no trusted Developer ID certificate, no Apple notarization and no Gatekeeper acceptance claim. macOS may block installation or launch. Windows installers remain unsigned and may trigger SmartScreen. Do not disable system protection; if blocked, stop and wait for a trusted signed release.
          NOTES
            release_label='ad-hoc unnotarized alpha preview'
          fi
          cat >> release-notes.md <<'NOTES'

          Includes Windows x64, Linux x64, macOS arm64/x64 installers, complete AGPL-3.0-or-later corresponding source (including locked FFmpeg/x264 source and third-party notices), per-platform provenance and SHA256SUMS.txt.

          Image generation fix: character, scene and free-canvas visual exclusions are preserved as ordinary prompt text, not sent as an unsupported native negative_prompt field. An image submission marked retry-unsafe is not automatically retried or rotated to another provider, reducing duplicate-submission and billing risk; an ambiguous upstream failure may still have incurred a charge. Textual exclusions are not a guarantee of model behavior, and paid API generation has not been verified by these builds.

          Download the correct architecture and verify checksums and signing provenance. Successful builds and integrity checks do not certify browser-first installation, Windows native installation, paid API generation or older OS compatibility. No user API keys are included.
          NOTES
          printf '\nBuild and installation guidance for this exact release: https://github.com/%s/blob/%s/BUILDING.md\n' "$GH_REPO" "$SOURCE_TAG" >> release-notes.md
          gh release create "$SOURCE_TAG" --verify-tag --draft --prerelease --title "YITOKEN Studio $VERSION ($release_label)" --notes-file release-notes.md
          # No --clobber: upload failures leave a draft for inspection, not a partial public release.
          gh release upload "$SOURCE_TAG" publish-assets/*
          test "$(gh api "repos/$GH_REPO/commits/$SOURCE_TAG" --jq '.sha')" = "$SOURCE_COMMIT"
          gh release edit "$SOURCE_TAG" --draft=false --prerelease
